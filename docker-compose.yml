services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: sqlite:///storage/doitall.db
      QDRANT_URL: http://qdrant:6333
      API_KEY: ${API_KEY:?set API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://example.com"]}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - doitall-storage:/app/storage
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
volumes:
  doitall-storage:
  qdrant-storage:
