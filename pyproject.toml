[project]
name = "doitall"
version = "0.1.0"
description = "A modular AI framework for agents, RAG, persistent memory, and multi-provider LLM applications."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "ROHAN", email = "rohan.sharma1234987650@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "litellm>=1.93.0",
    "loguru>=0.7.3",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.18.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "typer>=0.27.0",
    "tzdata>=2026.3",
    "uvicorn>=0.51.0",
]

[project.scripts]
doitall = "doitall.main:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
